# The run that produced scores.jsonl, written back so this directory replays alone

[benchmark]
RECIPE_PATH = "/home/kuroma/Documents/projects/nlp/arxivkg/retrieval_recipes"
OUTPUT_PATH = "/home/kuroma/Documents/projects/nlp/arxivkg/experiments/retrieve"
RETURN_LIMIT = 1000
BUDGETS = [100, 200, 500, 1000]
SEED = 0
SAMPLE_RATE = 1.0
MAX_SAMPLES = 300
SURVEY_THRESHOLD = 0.95
MIN_REFERENCES = 25
GAP_DAYS = 190
FRONTIER_COSINE = 0.8
FRONTIER_MIN_KEY = 10
FRONTIER_WINDOW_DAYS = 730
CONSENSUS_COSINE = 0.75
CONSENSUS_MIN_KEY = 5
PRECISION_LEVEL = 2
metric = "FrontierMatch"

[benchmark.recipes]
SurveyMatch = ["survey.toml", "anc_only.toml", "survey_no_forward.toml", "all_terms.toml", "no_expansion.toml", "cosine_only.toml"]
FrontierMatch = ["frontier.toml", "survey.toml", "frontier_no_forward.toml", "all_terms.toml", "cosine_only.toml"]
ConsensusMatch = ["consensus.toml", "consensus_no_forward.toml", "survey.toml", "all_terms.toml", "cosine_only.toml"]
PrecisionMatch = ["survey.toml", "frontier.toml", "cosine_only.toml"]


# The recipe, copied verbatim from retrieval_recipes

NAME = "cosine_only"

[[component]]
KIND = "CosineRetriever"
LIMIT = 5000
