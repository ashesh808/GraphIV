[project]
name = "graphiv"
version = "0.1.0"
description = "A knowledge graph over all of arXiv, and a grounded literature-review endpoint on top of it"
requires-python = ">=3.13"
dependencies = [
    "azure-identity",
    "azure-storage-blob",
    "faiss-cpu",
    "mcp>=1.28.1",
    "numpy>=2.4.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0",
    "scipy",
    "selectolax>=0.4.10",
    "starlette",
    "uvicorn",
]

[project.scripts]
graphiv-serve = "apps.api.main:main"

[project.optional-dependencies]
nomic = [
    "torch==2.12.0",
    "transformers==5.9.0",
    "accelerate==1.14.0",
    "einops==0.8.2",
    "safetensors==0.7.0",
    "huggingface-hub==1.17.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "nomic", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
index-build = [
    "pyarrow",
    "huggingface-hub==1.17.0",
]
offline = [
    "datasets>=5.0.0",
    "dspy>=3.3.0",
    "einops>=0.8.2",
    "huggingface-hub",
    "matplotlib>=3.10.9",
    "peft>=0.19.1",
    "pymupdf>=1.27.2.3",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.0",
    "transformers>=5.9.0",
    "umap-learn>=0.5.9",
]
research = [
    { include-group = "offline" },
    "cmaes>=0.13.1",
    "optuna>=5.0.0",
    "openai>=2.38.0",
]
dev = [
    { include-group = "research" },
    "import-linter>=2.0",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src", "apps/api", "apps/__init__.py"]

[tool.hatch.build.targets.wheel.force-include]
"legacy/research-webui" = "src/_resources/legacy/research-webui"
"retrieval_recipes" = "src/_resources/retrieval_recipes"
"configs/runtime.toml" = "src/_resources/configs/runtime.toml"


[tool.hatch.build.targets.sdist]
include = [
    "/src", "/apps", "/offline", "/research", "/legacy", "/infra", "/retrieval_recipes",
    "/tests", "/configs", "/docs", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/README.md", "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
# a cache holds data, including upstream code cloned to reproduce a published number
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "ANN", "BLE", "D"]
# D200/D212/D415 contradict the docstring form STYLE.md documents
ignore = ["ANN401", "D100", "D104", "D107", "D200", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"offline/**" = ["D"]
"research/recipe_tuning/**" = ["D"]
"legacy/serve.py" = ["D"]
"notebooks/**" = ["D", "ANN"]
"tests/**" = ["D", "ANN"]
# experiment code embeds prompt text, SQL and browser scripts, where width is content
# the experiment shims must set sys.path before importing their own logic
# embedded JS, CSS and prompt literals: the width is content, not a wrapped sentence
"scratchpad/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["src", "apps", "offline", "research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pipeline helpers retain the same imports as their directly executed stages.
pythonpath = [".", "offline/export", "research/recipe_tuning"]
addopts = "-ra -m 'not slow and not gpu'"
markers = [
    "slow: needs real data or a long run",
    "gpu: needs a GPU",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
include = ["src", "apps/api", "offline", "research/recipe_tuning"]
extraPaths = ["."]
exclude = ["scratchpad", "notebooks", "**/__pycache__", ".venv"]

# torch's stub does not re-export its own names, and flash-attn is an optional accelerator
[[tool.pyright.executionEnvironments]]
root = "offline/citation_labeler"
reportPrivateImportUsage = "none"
reportMissingImports = "none"

[[tool.pyright.executionEnvironments]]
root = "offline/citation_preprocess"
reportPrivateImportUsage = "none"
reportMissingImports = "none"

# The library is layered and independent of application services and pipeline scripts.
[tool.importlinter]
root_packages = ["src", "apps", "offline", "research"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the production library is layered"
type = "layers"
layers = ["src.mcp", "src.report", "src.miner", "src.retrieve", "src.storage", "src.core"]

[[tool.importlinter.contracts]]
name = "production code never imports offline or research code"
type = "forbidden"
source_modules = ["src", "apps"]
forbidden_modules = ["offline", "research"]

[[tool.importlinter.contracts]]
name = "the production library never imports application entrypoints"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["apps"]
