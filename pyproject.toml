[project]
name = "graphiv"
version = "0.1.0"
description = "A knowledge graph over all of arXiv, and a grounded literature-review endpoint on top of it"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "dspy>=3.3.0",
    "einops>=0.8.2",
    "mcp>=1.28.1",
    "numpy>=2.4.5",
    "peft>=0.19.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0",
    "scikit-learn>=1.9.0",
    "selectolax>=0.4.10",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.0",
    "umap-learn>=0.5.9",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "matplotlib>=3.10.9",
    "openai>=2.38.0",
    "pymupdf>=1.27.2.3",
    "pytest",
    "pytest-cov",
    "rapidfuzz>=3.14.5",
    "transformers>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "experiments/_harness"]

[tool.black]
line-length = 100
extend-exclude = "experiments/.*/cache/"
target-version = ["py313"]

[tool.ruff]
# a cache holds data, including upstream code cloned to reproduce a published number
extend-exclude = ["experiments/*/*/cache"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "ANN", "BLE", "D"]
# D200/D212/D415 contradict the docstring form STYLE.md documents
ignore = ["ANN401", "D100", "D104", "D107", "D200", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D"]
"notebooks/**" = ["D", "ANN"]
"tests/**" = ["D", "ANN"]
# experiment code embeds prompt text, SQL and browser scripts, where width is content
"experiments/**/src/*.py" = ["D", "E501"]
"experiments/_harness/measure/judge.py" = ["D", "E501"]
"experiments/_harness/measure/vision_check.py" = ["D", "E501"]
"experiments/**" = ["D"]
# the experiment shims must set sys.path before importing their own logic
"experiments/**/run.py" = ["D", "E402"]
# embedded JS, CSS and prompt literals: the width is content, not a wrapped sentence
"scratchpad/**" = ["ALL"]

# experiments/ still imports the parked package, so isort keeps classifying it
[tool.ruff.lint.isort]
known-first-party = ["graphiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".legacy"]
addopts = "-ra -m 'not slow and not gpu'"
markers = [
    "slow: needs real data or a long run",
    "gpu: needs a GPU",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
include = ["src", "scripts"]
exclude = [".legacy", "scratchpad", "notebooks", "**/__pycache__", ".venv"]

# torch's stub does not re-export its own names, and flash-attn is an optional accelerator
[[tool.pyright.executionEnvironments]]
root = "scripts/citation_labeler"
reportPrivateImportUsage = "none"
reportMissingImports = "none"

[[tool.pyright.executionEnvironments]]
root = "scripts/citation_preprocess"
reportPrivateImportUsage = "none"
reportMissingImports = "none"
