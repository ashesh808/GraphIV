# The survey point with every frontier term at zero, which is what a seed paper was built on
NAME = "ancestry"

[[component]]
KIND = "CosineRetriever"
LIMIT = 5000

[[component]]
KIND = "AncestorExpander"
TOP_K = 200
HOP_LIMIT = 20000

[[component]]
KIND = "FrontierExpander"
TOP_K = 200
HOP_LIMIT = 20000

[[component]]
KIND = "GraphScorer"
CORE = 200
DEPTH = 4
DECAY = 0.5

[component.weights]
COS = 0.75
REC = 0.75
ANC = 4
FRO = 0
ANC2 = 0
FRO2 = 0
ANC_DECAY = 0
FRO_DECAY = 0
COCITE = 0.5
COUPLE = 0
HUB = 0.5

# What the miner does above the ranking, in the one file the mode already picks
[miner]
# measured best at 4 over the on-topic share of a hard question
GATE = 4.0
# the same exponent the gate takes, since it answers the same question about the same cosine
FOCUS = 4.0
# the walk runs on the head of the list, where two runs still land on the same path
WALK_PREFIX = 30
CONNECTORS = 40
DECAY = 0.5
KNOCKDOWN = 0.4
SEEDS = 10
WALKS = 50
BRANCH = 1
ARGUES = ["extends", "critiques", "compares"]
SUCCESSOR_DAYS = 240
SUCCESSOR_FLOOR = 0.60
GRAPH_WEIGHT = 0.65
RELEVANCE_WEIGHT = 0.35

# how much each intent says the citing paper took a position rather than waved at the work
[miner.weights]
extends = 1.0
critiques = 1.0
compares = 0.8
uses = 0.4
motivates = 0.15
background = 0.0
